<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Resizable & Draggable PDF Viewer</title>
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
    </head>
    <body>
        <div id="pdf-container">
            <div class="resizer corner top-left" data-direction="tl"></div>
            <div class="resizer corner top-right" data-direction="tr"></div>
            <div class="resizer corner bottom-left" data-direction="bl"></div>
            <div class="resizer corner bottom-right" data-direction="br"></div>
            <div class="resizer edge top" data-direction="t"></div>
            <div class="resizer edge bottom" data-direction="b"></div>
            <div class="resizer edge left" data-direction="l"></div>
            <div class="resizer edge right" data-direction="r"></div>

            <div id="content-wrapper">
                <div id="controls">
                    <label for="pdf-file-input">Select PDF:</label>
                    <input type="file" id="pdf-file-input" accept="application/pdf" />
                </div>

                <div id="page-info-status">
                    <p id="status-message">Please select a PDF file to view.</p>

                    <div id="navigation-controls" style="display: none">
                        <label for="page-input">Page:</label>
                        <input type="number" id="page-input" value="1" min="1" style="width: 50px; text-align: center" />
                        <span> of <span id="page-count">0</span></span>
                    </div>
                </div>

                <canvas id="pdf-render"></canvas>
            </div>
        </div>

        <script src="script.js" type="module"></script>
    </body>
</html>
