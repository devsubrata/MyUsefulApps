<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Password Generator</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="container">
            <h1>🔐 Password Generator</h1>

            <div class="password-display">
                <input type="text" id="password" readonly placeholder="Your generated password will appear here" />
                <button id="copy-btn">📋 Copy</button>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="length">Password Length: <span id="length-value">12</span></label>
                    <div class="slider-container">
                        <input type="range" id="length" min="4" max="32" value="12" step="1" />
                    </div>
                </div>

                <div class="control-group">
                    <label>Character Types:</label>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="uppercase" checked />
                            Uppercase (A-Z)
                        </label>
                        <label>
                            <input type="checkbox" id="lowercase" checked />
                            Lowercase (a-z)
                        </label>
                        <label>
                            <input type="checkbox" id="numbers" checked />
                            Numbers (0-9)
                        </label>
                        <label>
                            <input type="checkbox" id="symbols" checked />
                            Symbols (!@#$%&)
                        </label>
                    </div>
                </div>
            </div>

            <div class="strength-meter">
                <label>Password Strength:</label>
                <div class="strength-bar">
                    <div id="strength-level"></div>
                </div>
                <div class="strength-text">
                    <span id="strength-label">Weak</span>
                    <span id="entropy">0 bits</span>
                </div>
            </div>

            <div class="buttons">
                <button id="generate-btn">Generate Password</button>
                <button id="reset-btn">Reset Settings</button>
            </div>
        </div>

        <div class="notification" id="notification">Password copied to clipboard!</div>
    </body>
</html>
